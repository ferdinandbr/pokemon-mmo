<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="pot-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="60%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="pot-cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <radialGradient id="pot-glow" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="16" cy="28.5" rx="8" ry="2.2" fill="rgba(0,0,0,0.35)"/>
  <!-- Bottle body -->
  <path d="M 11 15 C 9 17 8 20 9 24 C 9.5 27 12 28 16 28 C 20 28 22.5 27 23 24 C 24 20 23 17 21 15 C 19 14 18 13.5 18 12 L 14 12 C 14 13.5 13 14 11 15 Z" fill="url(#pot-body)" stroke="#581c87" stroke-width="1.2"/>
  <!-- Bottle highlights -->
  <ellipse cx="13" cy="20" rx="3.5" ry="5" fill="url(#pot-glow)"/>
  <!-- White neck ring -->
  <rect x="13.5" y="10.5" width="5" height="2" rx="0.8" fill="url(#pot-cap)" stroke="#475569" stroke-width="0.8"/>
  <!-- Spray head -->
  <path d="M 12 6 C 12 4.5 13.5 3.5 16 3.5 C 18.5 3.5 20 4.5 20 6 L 20 10.5 L 12 10.5 Z" fill="url(#pot-cap)" stroke="#475569" stroke-width="0.8"/>
  <!-- Nozzle spout -->
  <path d="M 12 6.5 L 7.5 5.5 L 7.5 8 L 12 8.5 Z" fill="url(#pot-cap)" stroke="#475569" stroke-width="0.8"/>
</svg>
