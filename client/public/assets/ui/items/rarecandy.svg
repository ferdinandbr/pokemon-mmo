<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="candy-yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="candy-facet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="candy-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <ellipse cx="16" cy="28.5" rx="7" ry="2" fill="rgba(0,0,0,0.35)"/>
  <!-- Glowing crystal diamond -->
  <g filter="url(#candy-glow)">
    <polygon points="16,4 25,16 16,27 7,16" fill="url(#candy-yellow)" stroke="#a16207" stroke-width="1.2"/>
    <!-- Facet highlights -->
    <polygon points="16,4 16,27 7,16" fill="rgba(0,0,0,0.12)"/>
    <polygon points="16,4 25,16 16,16" fill="url(#candy-facet)"/>
    <!-- Center spark -->
    <circle cx="16" cy="14" r="2" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
